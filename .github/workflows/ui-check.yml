name: Peel UI check

on:
  push:
    branches:
      - ui/peel-shell-semantic-zoom

jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspace @peel/codex-app-server
      - run: npm run build --workspace @peel/git-workspace
      - run: npm run typecheck --workspace @peel/desktop
      - run: npm run test --workspace @peel/desktop
      - run: npm run build:renderer --workspace @peel/desktop
