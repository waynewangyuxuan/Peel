name: Capture semantic zoom screenshots

on:
  push:
    branches:
      - ui/peel-shell-semantic-zoom

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Capture real Electron surfaces
        run: |
          cd apps/desktop
          npx playwright test e2e/screenshot-review.spec.ts --config playwright.config.ts
      - name: Keep screenshots and remove temporary capture machinery
        run: |
          test -f docs/review/semantic-zoom/01-focus.png
          test -f docs/review/semantic-zoom/02-overview-detail.png
          test -f docs/review/semantic-zoom/03-overview-compact.png
          test -f docs/review/semantic-zoom/04-overview-map.png
          git config user.name "Wayne"
          git config user.email "101220495+waynewangyuxuan@users.noreply.github.com"
          git rm .github/workflows/capture-semantic-screenshots.yml apps/desktop/e2e/screenshot-review.spec.ts
          git add docs/review/semantic-zoom/*.png
          git commit -m "docs(ui): add semantic zoom review screenshots"
          git push origin HEAD:ui/peel-shell-semantic-zoom
