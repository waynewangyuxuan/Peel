name: Export semantic zoom screenshots

on:
  push:
    branches:
      - ui/peel-shell-semantic-zoom

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: peel-semantic-zoom-screenshots
          path: docs/review/semantic-zoom/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary export workflow
        run: |
          git config user.name "Wayne"
          git config user.email "101220495+waynewangyuxuan@users.noreply.github.com"
          git rm .github/workflows/export-semantic-screenshots.yml
          git commit -m "chore(ci): remove screenshot export workflow"
          git push origin HEAD:ui/peel-shell-semantic-zoom
