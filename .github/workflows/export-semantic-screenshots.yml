name: Export semantic zoom screenshots

on:
  push:
    branches:
      - ui/peel-shell-semantic-zoom

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify screenshot files
        run: |
          test -s docs/review/semantic-zoom/01-focus.png
          test -s docs/review/semantic-zoom/02-overview-detail.png
          test -s docs/review/semantic-zoom/03-overview-compact.png
          test -s docs/review/semantic-zoom/04-overview-map.png
          file docs/review/semantic-zoom/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: peel-semantic-zoom-screenshots
          path: docs/review/semantic-zoom/*.png
          if-no-files-found: error
          retention-days: 1
