      "criterion": "Disposable-repository tests exercise a main branch plus a divergent Ticket branch and a linked-worktree invocation; prove committed/staged/unstaged/renamed/binary/untracked Diff coverage; prove default Worktree ancestry from main rather than the Ticket branch; prove missing-main failure for both Diff and omitted-base Worktree creation; and prove that only the explicitly requested new Worktree branch/worktree artifacts are created while pre-existing refs, current checkout, main, and Git config remain unchanged."
    }
