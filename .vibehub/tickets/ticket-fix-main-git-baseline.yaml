    {
      "acceptance_id": "diff-against-main",
      "criterion": "Diff summary, full patch, and per-file patch compare the working tree to the merge base of main and current HEAD, so committed Ticket-branch changes plus staged, unstaged, renamed, binary, and untracked changes are represented; the returned Diff facts identify main as the comparison base."
    },
    {
      "acceptance_id": "worktree-starts-from-main",
      "criterion": "When baseRef is omitted, New Worktree creation resolves and starts from the current local main commit even when called from a different branch or linked worktree; an explicit internal baseRef remains validated and retry facts preserve the actual selected base."
    },
    {
      "acceptance_id": "surface-and-safety-regression",
      "criterion": "The desktop Diff surface visibly states that it is compared with main, and existing path containment, NUL-safe filenames, untracked content, failure recovery, Worktree metadata, and prohibited Git-management boundaries remain intact."
