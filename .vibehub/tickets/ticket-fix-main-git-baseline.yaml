      "acceptance_id": "resolve-main-separately",
      "criterion": "The adapter resolves local refs/heads/main independently from the active branch, never checks out, switches, rewrites, or treats the current Ticket branch as the default baseline, and returns an explicit recoverable error when main is unavailable instead of falling back to HEAD."
