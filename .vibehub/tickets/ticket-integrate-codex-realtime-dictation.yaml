  "active_contract_revision": 1,
  "constraints": [
    "Voice Dictation remains Record to Transcribe to editable Draft to explicit Send and never auto-sends.",
    "Codex App Server Realtime is experimental and remains behind a typed adapter capability plus runtime-preflight boundary; renderer components never consume raw JSON-RPC.",
    "Do not require, request, inherit, store, or expose an independent OpenAI API key or duplicate Codex authentication.",
    "Do not treat audio as a normal Turn input or permit a transcript-only Dictation gesture to start agent work.",
    "Do not claim Apple Speech has been replaced on a runtime where Codex Realtime rejects the existing ChatGPT/SIWC session.",
    "Preserve the existing ChatGPT-like microphone level, editable Draft, and no-speech recovery interaction."
  ],
  "context": "Implementation and a disposable live probe refined the original assumption. Codex 0.149.0 exposes thread/realtime/start, appendAudio, stop, and transcript notifications only when the realtime_conversation feature is enabled for the App Server process. Peel can enable that feature locally without mutating the user's global Codex configuration. However, a real empty Thread created under the user's existing ChatGPT/SIWC login accepts the start request and then emits thread/realtime/error with `realtime conversation requires API key auth`; the official Codex source explicitly marks ChatGPT/SIWC Realtime auth as a temporary unsupported case. Therefore existing Codex login cannot truthfully be claimed as a working Realtime transcription credential today. Peel must not add, request, inherit, or expose an independent API key to simulate that claim. Instead begin Dictation performs schema plus runtime preflight before opening microphone capture: a started event selects codex-realtime and preserves the transcript-only Draft lifecycle, while feature absence, unsupported Thread, auth-required, timeout, or preflight error selects the existing native adapter quietly. This keeps the Server path ready for a future Codex version that supports ChatGPT auth while making today's engine choice honest and safe.",
  "context_refs": [
