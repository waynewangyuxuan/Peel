  "active_contract_revision": 1,
  "constraints": [
    "Optimize perceived and measured startup without replacing Electron, Streamdown, or the accepted renderer stack.",
    "Do not cache or fabricate Codex connection, Thread, status, or transcript facts to make launch appear faster.",
    "Do not weaken context isolation, sandboxing, CSP, external-navigation denial, or current process ownership.",
    "Keep benchmark-only instrumentation out of ordinary user-visible UI and distinguish first paint from connected readiness."
  ],
  "context": "The Electron BrowserWindow remains hidden until ready-to-show, the HTML root is empty until the full statically imported React application loads, and Peel starts its Codex App Server connection only after createWindow has awaited renderer loading. This serial path makes a healthy launch feel blank or slow and delays connection readiness. Establish a reproducible packaged-app baseline, render an honest branded shell as early as possible, overlap independent initialization, and retain explicit offline/reconnecting behavior rather than hiding real Codex delays. Execution measured a 438 ms baseline median first-contentful paint and found Electron process/window startup dominates that interval: splitting the synchronous renderer from 703 KB to 193 KB changes what the user sees first and removes avoidable application work, but cannot honestly promise a 30% process-launch reduction. The performance gate therefore protects same-host paint/shell/connection timing while requiring a material first-frame bundle reduction and direct proof that Codex initialization is no longer gated by full App hydration.",
