  "active_contract_revision": 1,
  "constraints": [
    "Implement the active Thread-first model; do not reintroduce Project-first navigation, Add to Space, Forest, arbitrary Edge, or Cross-project graph from the historical Demo/PRD.",
    "Codex owns conversation and execution facts; Peel owns only Space and view metadata.",
    "Focus remains screen-space and full fidelity; Overview remains deterministic and contains no Composer.",
    "Voice Dictation, New Worktree, Diff, basic Subagent information, and automatic short title are v0.1 P0.",
    "Do not add generic graph editing, agent dashboard, Git dashboard, Project management, semantic interpretation, Compare, or Convergence."
  ],
  "context": "This is one coherent vertical product outcome, not a collection of disconnected UI components. It integrates the two adapters into the selected shell and must preserve the Demo's interaction hierarchy while applying the active Thread-first decisions that supersede its Project-first content.",
