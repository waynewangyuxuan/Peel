      "criterion": "Branch from here and Peel create the same local Fork Draft from a completed Turn within 150ms; Escape leaves no durable Thread/worktree; First Send uses exact lastTurnId, optional Current/New Worktree, and never loses Prompt across Worktree, Fork, or First Turn failures.",
