    {
      "acceptance_id": "packaged-desktop-lifecycle",
      "criterion": "A production package builds from a clean checkout, launches outside the development server, owns App Server start/handshake/reconnect/shutdown, connects to local Codex, and restores Peel-owned Space membership, Drafts, Scroll, Node positions, and Camera position after a full application restart.",
      "identity": "sha256:3b2611eb3e57c538f935d291eee42e0e7963a29bbafad83ceb9f6ee96efa94d4",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "real-voice-dictation",
      "criterion": "The packaged desktop app captures real microphone audio and transcribes it into the current editable Thread Draft without auto-send; microphone denial, capture interruption, and transcription failure are recoverable and never erase or replace the existing Draft. A test-only fake text insertion cannot satisfy this criterion.",
      "identity": "sha256:865628896f2b8bbb099cbe0e05b501709de9e0c0fc9d9a7613e65af8c2295cb5",
      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "thread-first-entry",
      "criterion": "The desktop app lists/searches existing Codex Threads, opens one in normal Focus Chat, and creates a Space whose only Root is that Thread without requiring or displaying Codex Project membership.",
