  "context": "v0.1 proved real Thread discovery but hard-coded one 50-item request and made every Picker open or term change wait for App Server. Dogfood exposed both the ceiling and latency. This Ticket fixes the discovery path without pulling v0.2 Space Search or broad UI restyling into the change.",
