      "acceptance_id": "responsive-warm-and-provisional-search",
      "criterion": "With an automated App Server fixture delaying thread/list by 750ms, a completed warm page reopens in the Picker within 100ms with no additional request; typing a term shows matching warm-page Chats provisionally within 100ms while the authoritative server search continues, and repeating a completed identical query within the 15,000ms TTL resolves within 100ms with no additional request.",
