      "revision": 1,
      "state": "active"
    },
    {
      "acceptance_id": "search-race-safety",
      "criterion": "Rapid typing, clearing, closing, reopening, and Load more cannot allow a late response for an older term or cursor to replace or append into the current result set; current results remain usable while refresh feedback is non-blocking.",
      "identity": "sha256:db83fe5c7374701e350396efb1d0ce097fc92f6dc246dac329a5c4c43a7c1754",
      "revision": 1,
