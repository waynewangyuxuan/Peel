  "context": "Live Codex 0.154 timing found that ordinary first-page thread/list completes in about 1.76 seconds while the same request with searchTerm set to the empty string takes about 15.8 seconds. PeelService trims the query but always calls client.searchThreads(term), and its connection warmup explicitly calls searchThreads({ term: \"\" }); the adapter therefore serializes searchTerm: \"\". This regresses the completed warm-cache Ticket in real dogfood even though delayed fixtures passed. The correction should preserve the existing cursor, cache, provisional-result, and race-safety contract while distinguishing an absent empty query from a real non-empty search.",
