  "active_contract_revision": 1,
  "constraints": [
    "Codex remains the Source of Truth for Thread and Transcript; do not copy rollout history into Peel or rebind a missing Thread by fuzzy title.",
    "A failed send must never clear the Composer Draft or attachments, and an automatic retry is allowed only when the failed RPC cannot have created a Turn.",
    "Voice remains real Apple Speech Recognition and editable Draft insertion; do not replace it with fake text, auto-send, or defer it.",
    "Do not request or mutate privacy permission for ChatGPT/Codex. The supported product path is an independently launched Peel bundle with its own declared identity.",
    "Preserve the current Demo-aligned Focus, Markdown, and Overview presentation while changing lifecycle and error states."
  ],
  "context": "Direct dogfood exposed two concrete lifecycle defects. Peel reads stored Threads with thread/read and then calls turn/start without first loading them through thread/resume, so Codex correctly returns `thread not found` even though the rollout files remain present and a fresh App Server can read them. Separately, the dogfood instance was launched as a child of Codex/ChatGPT; macOS attributed Speech Recognition to com.openai.codex, refused it for the missing usage description, and terminated peel-speech, while the independently launched packaged Peel is attributed to com.peel.desktop. This focused repair restores both daily-use paths and makes the remaining failure states understandable and non-destructive.",
