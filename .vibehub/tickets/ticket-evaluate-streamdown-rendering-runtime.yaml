  "constraints": [
    "Do not perform a broad assistant-ui migration in this Ticket; Streamdown is evaluated independently behind Peel's existing renderer boundary.",
    "Do not enable arbitrary raw HTML, script, iframe, forms, event handlers, remote embeds, or untrusted style in the transcript.",
    "Do not replace Codex App Server state with a parallel chat-history store or fabricate Turn and lineage semantics.",
    "Do not claim a renderer win from synthetic parser timing alone; measure the production Electron surface and separate backend latency from render latency.",
