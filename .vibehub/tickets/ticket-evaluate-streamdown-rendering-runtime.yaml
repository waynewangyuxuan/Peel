  ],
  "context": "Peel currently reparses each accumulated streaming string through ReactMarkdown and traverses the full transcript, while the accepted audit identifies unbounded large-thread risk but requires measurement before optimization. Hermes Desktop provides a mature reference: Streamdown-based block rendering, stable message identity, memoized math, lazy heavy code support, cost-budgeted first paint and incremental backfill, content visibility for settled history, and a committed performance harness. This Ticket is an A/B decision spike rather than an unconditional framework migration. Streamdown is evaluated first behind Peel's existing ThreadItem-to-view boundary; assistant-ui runtime adoption remains optional and must not replace Codex App Server authority, exact Turn anchors, approvals, tool surfaces, Branch behavior, or Space metadata.",
