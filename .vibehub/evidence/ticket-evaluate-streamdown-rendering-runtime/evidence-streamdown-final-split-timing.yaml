  "summary": "Final production-Electron verification separates corpus construction, Markdown/render work through a React layout-effect commit marker, and the remaining post-commit two-animation-frame paint interval. Current versus Streamdown at 500 Turns measured 132.3/161.6ms through Markdown and commit and 174.9/201.2ms through paint; the 10-to-500 switch was 158.5/194.0ms. Streamdown therefore remained slower on transcript-scale work while its 36-update stream retained the steadier p99 frame interval, 16.8ms versus 25.4ms, with effectively tied total stream time, 599.5ms versus 609.0ms. Correctness, tail-only invalidation, heap/DOM, long-task, reducer, zero-thread-read, and fallback assertions all passed. The stronger split timing preserves the defer decision.",
