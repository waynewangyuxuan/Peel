  "summary": "SpaceRecord now persists an explicit default/manual name origin. Directly created and imported Spaces begin default-owned; the first text prompt immediately gives the Root and default-owned Space the same deterministic temporary title, and completed automatic or later manual Root naming continues that synchronization. An explicit Space rename switches provenance to manual, after which automatic, manual, and notification-driven Root changes cannot overwrite it. StateStore merge derives every default-owned name from the winning merged Root title so stale renderer saves cannot roll it back, while a prior manual Space beats stale default state. Legacy normalization treats only an exact New Chat label as the former generated default, repairs it from a useful Root title, and preserves every other legacy label as manual.",
