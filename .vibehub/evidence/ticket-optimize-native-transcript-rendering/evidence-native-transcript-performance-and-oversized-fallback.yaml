  "summary": "The production Electron A/B harness exercises the ordinary App to Focus to Transcript to MarkdownContent route with two warmups and seven measured samples per mode. For 100 settled Turns plus 36 live-tail deltas, optimized median reconciliation plus React render/commit fell from 36.25 ms to 1.50 ms (95.9%), with zero historical Turn renders, zero historical Markdown renders, exactly 36 deltas, and no streaming long tasks. Optimized cold 10/100/500 first-content and through-paint medians were 11.2/28.4, 65.4/70.0, and 289.8/309.0 ms; the 10-to-500 warm switch was 264.4/284.7 ms. Every comparison stayed within the greater-of-10%-or-5-ms regression limit. The harness separately records App Server read, snapshot construction, IPC, reconciliation, React commit, two-frame paint, long tasks, DOM, and heap diagnostics. The exact 200,086-character oversized fixture rendered as selectable inert plain text with local overflow, zero interpreted HTML elements, and zero remote images.",
