  "summary": "The supported Server lifecycle sends measured PCM16 chunks with sample metadata, accepts only user-role transcript deltas/completions, and merges the finished transcript into the latest editable Draft without auto-send or thread/turn/start. Ordered audio append and concurrent Draft typing are preserved. Thread switch, unmount, recorder interruption, append failure, permission denial, active Server error, and explicit cancel close the matching session and cannot write into another Thread. Append failures reset the recorder UI as soon as the failed audio request returns; Thread changes reset voice state, levels, and feedback so the newly selected Composer is immediately retryable while the original Draft restores on return. Tests cover fragmented transcript assembly, role filtering, exact thread isolation, start/append/server-error cleanup, active recording Thread switch, cancellation, Draft merge, fallback, and native regression."
