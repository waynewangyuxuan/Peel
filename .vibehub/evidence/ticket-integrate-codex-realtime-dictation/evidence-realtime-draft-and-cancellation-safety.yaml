  "summary": "The supported Server lifecycle sends measured PCM16 chunks with sample metadata, accepts only user-role transcript deltas/completions, and merges the finished transcript into the latest editable Draft without auto-send or thread/turn/start. Ordered audio append and concurrent Draft typing are preserved. Thread switch, unmount, recorder interruption, append failure, permission denial, Server failure, and explicit cancel close the matching session and cannot write into another Thread. The same Composer retains live level feedback and uses concise no-speech/failure presentation on the native path. Tests cover fragmented transcript assembly, role filtering, exact thread isolation, cancellation, Draft merge, fallback, and native regression."
