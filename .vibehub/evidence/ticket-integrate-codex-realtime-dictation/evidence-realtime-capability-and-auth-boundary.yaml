  "summary": "The adapter enables realtime_conversation only for Peel's owned App Server child process, requires the complete three-method and five-notification schema, and retains stable-method fallback when the method is absent or unavailable. Begin Dictation performs a matching Thread runtime preflight before opening microphone capture and selects codex-realtime only after thread/realtime/started; typed error, closed, timeout, unsupported Thread, thrown start request, or missing method selects native-fallback without exposing raw protocol copy, and every ambiguous start path now makes a best-effort stop before fallback. The live installed-Codex probe passed against 0.149.0 and accurately recorded schema compatibility plus the current ChatGPT/SIWC runtime rejection `realtime conversation requires API key auth`, zero created Turns, and zero Turn events. Transport environment tests and implementation inspection confirm Peel neither inherits nor introduces OPENAI_API_KEY or renderer credentials.",
