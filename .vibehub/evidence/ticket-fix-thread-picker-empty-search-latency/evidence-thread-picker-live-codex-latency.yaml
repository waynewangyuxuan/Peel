  "summary": "A rebuilt packaged Peel and a separate read-only Codex 0.154 ordinary-list probe passed against the installed local server. Transport became ready in 157ms; the ordinary thread/list request was issued in the same millisecond with searchTerm omitted and returned 30 Threads in 1,938ms. In the packaged UI, Search Chats became available 499ms after launch, a cold open reached first content in 2,834ms, and closing then reopening the already loaded Picker reached first content in 15ms. The first page exposed a real nextCursor and Load more produced 59 total locally available Threads. These measurements separate transport, server-list, cold UI, and warm-render latency and prove the former 15.8-second explicit-empty route is no longer used.",
