  "summary": "The permanent packaged Electron harness recorded seven unfiltered before and seven final-tree after samples on the same Apple-silicon host. Baseline commit 41550b3 medians were 438 ms first-contentful paint, 454 ms local shell, 478 ms initialize request, 480 ms transport ready, and 513 ms connected action. Final medians were 441, 490, 443, 460, and 532 ms respectively, passing the explicit 488/504/613 ms gates while moving initialize 35 ms and transport-ready work 20 ms earlier. Vite's first-frame entry fell from about 703 KB to 193.06 KB (27.5%, below the 35% gate); App is an asynchronous 85.37 KB chunk and Markdown remains a separate 441.45 KB chunk. The inline-styled HTML frame shows the Peel mark and honest opening state before App hydration, service connection begins before createWindow loading, and the delayed-hydration Electron regression observes initialize in flight while that static frame is still visible.",
