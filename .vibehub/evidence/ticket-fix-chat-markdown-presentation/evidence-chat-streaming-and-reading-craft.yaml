  "summary": "Streaming uses a render-only projection for unfinished emphasis, inline and fenced code, blockquotes, lists, links, and incomplete table headers; completed message strings still parse verbatim. Parameterized tests prove those partial states render semantically without exposing their orphan delimiters, and the Electron fixture holds an unmatched opening ** on screen before the closing fragment arrives while asserting that the displayed text contains no **. Direct inspection at 1440x960 and 1000x720 confirmed restrained quote blocks with no > marker, readable nested Reasoning content, bounded GFM tables, compact user bubbles, and a dark code surface with language, horizontal-only scrolling, selectable text, pointer/keyboard Copy code, immediate Copied feedback, and a real clipboard write that the test restores.",
