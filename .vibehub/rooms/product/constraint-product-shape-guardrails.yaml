{
  "context_id": "constraint-product-shape-guardrails",
  "detail": "设计和实现评审必须检查六类失败：(1) Graph Viewer：图好看但仍要逐个打开 Chat 才能理解；用确定性高密度 Card 和可追溯 Snippet 缓解。(2) Codex Clone：大量复刻原生功能掩盖 Spatial Fork；用 Open in Codex 和主路径聚焦缓解。(3) Agent/Execution Dashboard：Worktree、Diff、Subagent/Test 成为主界面；坚持它们是 Thread metadata/activity。(4) Overview 不可信：模型误判 Decision/Conclusion；v0.1/v0.2 只显示事实。(5) Spatial Memory 失败：自动布局洗牌；位置持久化且 Tidy 只能显式触发。(6) Worktree friction：每次 Fork 强迫理解 Git；选择器轻量、仅 Git-backed 显示、默认继承当前环境方向且 First Send 前可改。新增 Project、Compare、Convergence、GitHub 或高级 Agent 能力时，若破坏 Focus Chat fidelity、真实 Fork semantics、deterministic Overview 或 stable spatial memory，就不应进入主界面。",
