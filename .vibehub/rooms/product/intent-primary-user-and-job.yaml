  "detail": "Primary User 是使用 Codex 处理真实工程或产品项目的个人开发者、产品工程师或 AI-native builder。他们在同一问题上会打开多条 Chat、从历史 Turn 创建 Branch、在一个 Repo 同时推进不同方向、可能使用多个 Worktree，并经常需要回到旧 Chat 恢复思路。核心 JTBD 是：当线性对话出现多个值得独立探索的方向时，把它们放进可见、可返回、可继续执行的结构，从而不依赖记忆管理来源；当多条相关 Chat/Worktree 并行时，看清从哪里分叉、各自在做什么，并快速进入任何路径。普通、没有分叉价值的 Chat 不需要进入 Peel。",
