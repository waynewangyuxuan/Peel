  "context_id": "decision-thread-first-space-entry",
  "detail": "v0.1 的桌面入口是 Thread-first：用户搜索或选择任意已有 Codex Chat，先按普通 Chat 打开；需要空间化时，以该 Thread 创建一个新的 Space Root，或在第一次 Branch from here 时自动建立这个 Space。Peel 不要求用户先选择 Project，也不自动镜像任何 Project Chat 列表。现阶段不提供把无关 Thread 加进已有 Space 的 Add to Space；一个 Space 只能通过真实 Fork 从 Root 向下增长。Space Name 默认来自 Root Title，但属于 Peel，可独立 Rename；Archive Space 只隐藏 Peel 对象，不修改 Codex Thread。",
