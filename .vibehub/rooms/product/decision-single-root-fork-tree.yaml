  "detail": "用户可以从任意已有 Codex Chat 创建一个 Space，该 Chat 成为唯一 Root。之后 Space 只通过从现有节点的 Completed Turn 执行真实 Fork 来增长；每个非 Root Thread 在该 Space 中恰好有一个 Parent，并记录准确的 forkedAtTurnId。Edge 只表达 Chat Fork，不表达 Git、Worktree、Subagent、依赖或用户手绘关系。v0.1/v0.2 不支持把无关 Chat 加入现有 Space、不支持 Forest、任意 Edge 或 Cross-project Graph。Worktree 只是 Thread 的执行位置，Subagent 只是 Parent Turn 的 Activity。",
