  "detail": "Production UI quality is judged by use, not palette resemblance or checklist completeness. Space and Thread titles must remain contained at supported widths, never create horizontal navigation scroll, and expose the complete current identity when visual truncation is necessary. Focus must render assistant and Reasoning content through a safe, real CommonMark/GFM pipeline so tables, blockquotes, headings, lists, emphasis, links, fenced code and streaming text never leak raw syntax. Command, File Change, Reasoning, Subagent and failure facts remain available but use a compact Chat-like disclosure hierarchy: human labels, secondary visual weight, completed detail collapsed by default, active/error states immediately legible, and Markdown parsed inside readable detail. The original Demo remains the overall material and spacing authority; ChatGPT/Codex interaction conventions guide content hierarchy and micro-interaction quality rather than creating a new visual direction.",
