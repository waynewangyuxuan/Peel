  "detail": "Focus 必须像高质量 Codex/ChatGPT Chat：一个完整、未被 Canvas transform 的 Chat Surface，加一条克制的 persistent Fork Tree，只回答当前位置、Parent/Sibling/Child、注意力状态和轻量 Worktree 信息。Overview 中没有 Focus Chat 和 Composer，完整 Fork Tree 成为主界面，Card 用更高密度的确定性信息回答探索形状、各分支最近在做什么和需要注意什么。Overview 不是放大的 Focus Tree，Focus 也不应塞入 Summary/Latest Result。模式切换是同一组真实 Thread 的观察尺度变化，不是两套产品或两份状态。",
