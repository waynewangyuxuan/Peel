  "detail": "Peel 是面向 Codex Desktop 的空间化 Chat 工作区。Codex 继续拥有 Conversation、Turn、Transcript、执行和运行状态；Peel 负责把真实 Thread 的 Fork lineage、稳定空间位置和跨分支注意力组织成 Focus 与 Overview 两种视图。首要价值不是复刻 Codex，也不是制作一张好看的图，而是让用户在产生多个分支后，能够更容易理解非当前分支、回到它并继续工作。",
