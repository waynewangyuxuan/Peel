  "detail": "用户只能从 Completed Turn 创建 Fork。标准入口是消息操作中的 Branch from here；Peel Handle 是同义的高带宽入口，不能成为唯一入口。触发后 150ms 内出现 Local Fork Draft、Child Surface 和已可见的 Parent/Child provenance，Composer 立即聚焦；此时不创建 Durable Thread 或 Worktree，Escape 取消且不留下空对象。First Send 才准备可选 Worktree、调用 thread/fork 并传 lastTurnId、保存 parentThreadId/childThreadId/forkedAtTurnId/createdAt，再在 Child 中开始第一轮。Worktree 失败时保留 Prompt 并可 Retry/切回 Current Workspace；Fork 失败保留完整 Draft；Fork 成功但 First Turn 失败保留 Child 可 Retry。任何失败不得丢失 Composer 内容。Child 的 Branched from 可返回 Parent 的准确 Fork Turn并短暂高亮；往返恢复各自 Scroll 与 Draft。",
