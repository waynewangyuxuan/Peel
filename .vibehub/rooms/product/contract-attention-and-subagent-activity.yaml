  "detail": "Focus Tree 和 Overview 对非 Focus Thread 只使用 Running、Needs approval、New result、Failed 四类需要用户注意的状态；Idle 不显示。New result 必须由 latestCompletedTurnId 与 lastViewedTurnId 的确定性比较产生，不由模型判断。Subagent 属于 Parent Thread 中某个 Turn 的后台 Activity，不进入主 Fork Tree、不改变 Space layout。Overview 可显示 Subagent Count/Status，Hover/展开优先使用真实 Agent Name/Nickname、Role、第一条 Delegated Task、Runtime Status 与 Latest Completed Result Snippet；不得自动生成额外 Summary。点击可以查看 Activity 或打开对应 Thread，但主导航仍是用户 Chat Fork Tree。",
