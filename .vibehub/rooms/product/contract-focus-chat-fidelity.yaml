  "context_id": "contract-focus-chat-fidelity",
  "detail": "完整 Chat DOM 始终位于 screen space，不随 Overview camera 缩放。Focus 必须支持 Transcript、Markdown、代码块横向滚动、文本选择复制、Composer、Attachments、Voice、Streaming、Command/File Change、Approval、Activity、错误和核心 Codex Item。Streaming 不得造成 Scroll Jump；用户主动向上滚动后停止 Auto-follow。每个 Thread 独立保存 Composer Draft 与 Scroll Position，切换和重启后恢复。Approval 必须显示在产生它的 Thread 内。暂未识别的 Codex Item 要用安全、可辨认的 fallback renderer 展示，并提供 Open in Codex，而不是静默丢弃。",
