  "detail": "原始 PRD 和 Demo 仍保留 Codex Project → multiple Spaces、Project 页面、Add to Space、无 Fork relation 的 membership，以及一个 Thread 可引用在多个 Space 的设计。这些是历史来源证据，不再是 v0.1/v0.2 的 active product contract。后续讨论明确改为 Desktop Thread-first：任意 Chat 创建一个新 Space Root；Space 只通过真实 Fork 扩展；不处理 Chat 被拖进/移出 Project；不加入无关 Chat、Forest 或 Cross-project graph。未来若加入 Project，只作为服务端 Context inheritance overlay，不恢复原来的 membership topology。任何从旧 Demo 或 PRD 自动蒸馏出的 Project-first 结论都必须让位于这条变更。",
