  "context_id": "decision-app-server-adapter-architecture",
  "detail": "本地 VibeHub workbench 的 hook-adapters.ts 和 verify-codex-plugin.mjs 是可复用的协议边界与测试模式：它们规范化 Codex hook payload，并验证 initialize → initialized → thread/start 与 MCP ready。但它们不是 Peel 可直接搬用的完整 Thread client，现有代码没有覆盖 thread/list/read/fork、turn/start、Approval reducer、turn/diff/updated 或 durable event reconciliation。Peel 应提取四个清晰边界：AppServerTransport 负责 stdio/JSON-RPC handshake、request correlation 与 reconnect；ThreadClient 封装 list/read/fork/name/turn/approval；EventReducer 将 Thread/Turn/Item stream 归一为可重建 UI state；GitWorkspaceAdapter 单独负责 New Worktree 和本地 Git 事实。复用的是 adapter discipline、wire verification 和 canonical event 思路，而不是把 VibeHub hook adapter 当作 drop-in client。",
