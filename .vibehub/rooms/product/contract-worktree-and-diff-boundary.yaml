  "detail": "Git-backed Parent 的 Fork Draft 在 First Send 前提供非 Modal 的 Current Workspace / Create a New Worktree 选择；Parent 已在 Worktree 时显示 Continue in this worktree / Create a New Worktree。用户可在 First Send 前修改，默认策略在 Dogfood 后确认。New Worktree 必须通过独立 Git Workspace Adapter 实现，不能假设 App Server 存在专用 create-worktree 方法；创建失败保留 Prompt 并允许 Retry 或切回当前环境。Worktree 只作为 Thread metadata，显示 Name 与 Changed File Count。点击打开临时 Diff Surface：文件列表、additions/deletions、file/hunk diff、Open Worktree、Open in Editor/Codex；退出后恢复原 Focus/Overview。v0.1 不实现 Worktree Dashboard、Git Graph、Branch Management、Commit/Push/PR 主流程或多个 Worktree 自动比较。",
