  "detail": "用户在真实 dogfood 中观察到 Thread Picker 像是只能列出 50 个 Codex Chats，并且打开列表与输入搜索词后的等待明显。代码核查确认 v0.1 把 thread/list 固定为 limit 50，UI 没有 cursor 分页；每个搜索词都等待 180ms 后重新请求 App Server，且没有缓存、请求去重、旧响应隔离或渐进加载。产品要求是：最近 Chats 首屏应快速出现；超过首屏的数据可以继续加载，不应被静默截断；搜索期间保留可用结果并提供明确但不阻塞的反馈；快速输入或重复查询不得被迟到的旧响应覆盖。",
