  "detail": "Activation 要求用户从已有 Chat 在 30 秒内创建第一个 Fork，且无需理解 Node/Edge/Graph/Git 术语。Core Utility 的关键证据是：拥有至少两个 Fork 的 Space 中，用户通过 Tree/Overview 返回非当前 Branch；用户不打开 Transcript 也能判断各 Branch 大致方向与状态；能准确回答当前 Thread 的 Parent 与 Sibling。Reliability 包括 Draft 丢失率 0、Fork Edge 与真实 lineage 一致、Node 意外位移率 0、Worktree 失败不丢 Prompt、Rename 同步目标 >99%。Dogfood 记录 Fork turn、Space size、fork-from-fork、Focus/Overview 使用、workspace/worktree 选择、Diff/Rename 行为、数日后重返 Branch 和最有辨识力的 Card 信息。指标用于决定 v0.2 scale、Project inheritance 与未来 Convergence，而不是证明活跃度本身。",
