  "detail": "Product Room 不能只保留几条高层结论。它必须把原始 PRD 的产品理由、领域模型、UX 契约、生命周期、边界、验收、风险与演进路径，Demo 的可观察交互和视觉基线，以及后续讨论对范围和技术可行性的修订，都沉淀为可检索的原子 Context。原始文件继续无损保留；Context 负责当前语义和检索，不能替代原文。每条蒸馏 Context 必须引用具体源文件或对话证据；当原始材料与后续明确讨论冲突时，保留冲突并以后续人类决定为准。规划和实现必须先查询 Context；涉及细节、视觉或遗漏风险时，还要读取对应原始来源。",
